# OpenMythos — Production Deployment
# Governance-first multi-model AI orchestration
#
# Usage:
#   docker compose -f docker-compose.openmythos.yml up -d
#   docker compose -f docker-compose.openmythos.yml run --rm eval
#
# Components:
#   - openmythos-api      : REST API (port 8080)
#   - openmythos-eval     : Benchmark runner
#   - openmythos-ledger   : Outcome ledger
#   - ollama              : Local model inference (optional, requires GPU)
#   - prometheus          : Metrics (port 9090)
#   - grafana             : Dashboards (port 3000)

services:
  # === Core API ===
  openmythos-api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - OPENMYTHOS_MODE=production
      - OPENMYTHOS_REGISTRY=/data/models/registry.json
      - OPENMYTHOS_LEDGER=/data/outcomes/ledger.jsonl
      - OPENMYTHOS_POLICIES=/data/policies/model-lifecycle.yaml
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    volumes:
      - openmythos-data:/data
      - ./models:/data/models:ro
      - ./policies:/data/policies:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # === Evaluation Runner (batch job) ===
  openmythos-eval:
    build:
      context: .
      dockerfile: Dockerfile
    profiles:
      - eval
    environment:
      - OPENMYTHOS_MODE=eval
      - OPENMYTHOS_REGISTRY=/data/models/registry.json
      - OPENMYTHOS_LEDGER=/data/outcomes/ledger.jsonl
    volumes:
      - openmythos-data:/data
      - ./cases:/data/cases:ro
      - ./traces:/data/traces
      - ./analysis:/data/analysis
    command: >
      python3 scripts/evaluate.py
      --corpus /data/cases/corpus.jsonl
      --model google/gemma-4-26b-a4b-it:free
      --backend openrouter
      --output /data/traces/latest-run.jsonl
      --governance-check --data-class public

  # === Ollama (local models, requires GPU) ===
  ollama:
    image: ollama/ollama:latest
    profiles:
      - local
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  # === Prometheus (metrics) ===
  prometheus:
    image: prom/prometheus:latest
    profiles:
      - monitoring
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    restart: unless-stopped

  # === Grafana (dashboards) ===
  grafana:
    image: grafana/grafana:latest
    profiles:
      - monitoring
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/dashboards:/etc/grafana/provisioning/dashboards:ro
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  openmythos-data:
  ollama-models:
  prometheus-data:
  grafana-data:
